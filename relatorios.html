<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatórios</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Frente de Caixa</h1>
    <nav>
      <ul>
        <li><a href="index.html">Vender</a></li>
        <li><a href="devedores.html">Devedores</a></li>
        <li><a href="produtos.html">Produtos</a></li>
        <li><a href="relatorios.html">Relatórios</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="filtro-periodo">
      <h2>Período</h2>
      <button data-periodo="dia">Hoje</button>
      <button data-periodo="semana">Semana</button>
      <button data-periodo="mes">Mês</button>
    </section>

    <section id="resumo">
      <h2>Resumo</h2>
      <p>Total vendido: <span id="total-periodo">R$ 0,00</span></p>
      <p>Nº de vendas: <span id="qtd-vendas">0</span></p>
      <button id="exportar-pdf">Exportar PDF</button>
    </section>

    <section id="pagamento">
      <h2>Devedor x À Vista</h2>
      <p>À Vista: <span id="total-avista">R$ 0,00</span></p>
      <p>Fiado (Devedor): <span id="total-fiado">R$ 0,00</span></p>
      <p><strong>Total Geral: <span id="total-geral">R$ 0,00</span></strong></p>
    </section>

    <section id="produtos-vendidos">
      <h2>Produtos Vendidos</h2>
      <ul id="lista-produtos-vendidos"></ul>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/relatorios.js"></script>
</body>
</html>
