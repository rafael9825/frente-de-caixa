<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vender</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/vendas.css">
  <script src="js/auth-guard.js"></script>
</head>
<body class="pagina-vendas">

  <header>
    <h1>Frente de Caixa</h1>
    <nav>
      <ul>
        <li><a href="index.html" class="ativo">Vender</a></li>
        <li><a href="devedores.html">Devedores</a></li>
        <li><a href="produtos.html">Produtos</a></li>
        <li><a href="relatorios.html">Relatórios</a></li>
        <li><button id="btn-sair" onclick="sairDoSistema()">Sair</button></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="lista-produtos">
      <h2>Produtos</h2>
      <input type="text" id="busca-produto" placeholder="Buscar produto...">
      <ul id="produtos"></ul>
    </section>

    <section id="carrinho">
      <h2>Venda Atual</h2>
      <ul id="itens-venda"></ul>

      <p class="linha-total">Total <span id="total-venda">R$ 0.00</span></p>

      <div class="bloco-troco">
        <label for="valor-recebido">Valor recebido (R$)</label>
        <input type="number" id="valor-recebido" step="0.01" min="0" placeholder="0.00">
        <p class="linha-troco">Troco <span id="troco-venda">R$ 0.00</span></p>
      </div>

      <label class="opcao-fiado">
        <input type="checkbox" id="venda-fiado">
        Venda fiado (devedor)
      </label>

      <div class="acoes-venda">
        <button id="limpar-venda">Limpar</button>
        <button id="finalizar-venda">Finalizar Venda</button>
      </div>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/vendas.js"></script>
</body>
</html>
