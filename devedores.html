<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devedores</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth-guard.js"></script>
</head>
<body>

  <header>
    <h1>Frente de Caixa</h1>
    <nav>
      <ul>
        <li><a href="index.html">Vender</a></li>
        <li><a href="devedores.html">Devedores</a></li>
        <li><a href="produtos.html">Produtos</a></li>
        <li><a href="relatorios.html">Relatórios</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="add-devedor">
      <h2>Adicionar Devedor</h2>
      <form id="form-devedor">
        <input type="text" id="nome-devedor" placeholder="Nome do devedor" required>
        <input type="number" id="valor-devedor" placeholder="Valor devido (R$)" step="0.01" required>
        <button type="submit">Adicionar</button>
      </form>
    </section>

    <section id="lista-devedores">
      <h2>Devedores</h2>
      <ul id="devedores"></ul>
      <p><strong>Total devido: <span id="total-devedores">R$ 0,00</span></strong></p>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/devedores.js"></script>
</body>
</html>
